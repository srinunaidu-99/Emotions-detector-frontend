<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VisionCore AI | Create Identity</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">


<style>

:root {
    --primary:#6366f1;
    --bg:#0b0f1a;
    --glass:rgba(255,255,255,0.03);
    --glass-border:rgba(255,255,255,0.1);
}


*{
    box-sizing:border-box;
}


body{

    margin:0;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:var(--bg);

    color:white;

    font-family:'Plus Jakarta Sans',sans-serif;

}



.container{

    width:400px;

    padding:40px;

    background:var(--glass);

    border:1px solid var(--glass-border);

    border-radius:20px;

    backdrop-filter:blur(10px);

}



h2{

    text-align:center;

    margin-bottom:30px;

}



input{

    width:100%;

    padding:14px;

    margin:10px 0;

    border-radius:10px;

    border:1px solid var(--glass-border);

    background:#000;

    color:white;

    outline:none;

}



input:focus{

    border-color:#6366f1;

}



button{

    width:100%;

    padding:14px;

    margin-top:20px;

    border:none;

    border-radius:10px;

    background:var(--primary);

    color:white;

    font-size:16px;

    cursor:pointer;

}



button:hover{

    background:#4f46e5;

}



.footer-text{

    text-align:center;

    margin-top:20px;

}



a{

    color:#6366f1;

    text-decoration:none;

}


</style>

</head>


<body>



<div class="container">


<h2>Create Account 🚀</h2>


<form id="registerForm">


<input 
type="text"
id="regName"
placeholder="Full Name"
required
>


<input 
type="email"
id="regEmail"
placeholder="Email Address"
required
>


<input 
type="password"
id="regPassword"
placeholder="Password"
required
>


<button type="submit">
Register
</button>


</form>



<p class="footer-text">

Already have account?

<a href="login.html">
Login
</a>

</p>



</div>





<script>


// Backend URL

const API_URL = "http://localhost:3000";


// If using ngrok:
// const API_URL = "https://your-ngrok-url.ngrok-free.dev";



const registerForm = document.getElementById("registerForm");



registerForm.addEventListener("submit", async(e)=>{


e.preventDefault();



const name =
document.getElementById("regName").value;



const email =
document.getElementById("regEmail").value;



const password =
document.getElementById("regPassword").value;



try{


const response = await fetch(
`${API_URL}/register`,
{

method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

name:name,

email:email,

password:password

})


});



const data = await response.json();



console.log(data);



if(response.ok){


alert("✅ Register Success");


window.location.href="login.html";


}

else{


alert(data.message || "Register Failed");


}



}

catch(error){


console.log(error);


alert(
"❌ Backend not connected"
);


}



});



</script>



</body>

</html>
