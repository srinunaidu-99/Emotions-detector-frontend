<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VisionCore AI | Secure Login</title>


<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">


<style>

:root {
    --primary:#6366f1;
    --primary-hover:#4f46e5;
    --bg:#0b0f1a;
    --glass:rgba(255,255,255,0.03);
    --glass-border:rgba(255,255,255,0.1);
    --text-muted:#94a3b8;
}


*{
    box-sizing:border-box;
    font-family:'Plus Jakarta Sans',sans-serif;
}


body{

    margin:0;

    background-color:var(--bg);

    background-image:
    radial-gradient(circle at 0% 0%,rgba(99,102,241,0.15),transparent 40%),
    radial-gradient(circle at 100% 100%,rgba(0,242,255,0.1),transparent 40%);

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    color:white;

}



.glow-orb{

    position:absolute;

    width:400px;

    height:400px;

    background:#6366f1;

    filter:blur(150px);

    opacity:.1;

}



.container{

    width:420px;

    padding:3rem;

    background:var(--glass);

    backdrop-filter:blur(25px);

    border:1px solid var(--glass-border);

    border-radius:32px;

    box-shadow:0 25px 50px rgba(0,0,0,.5);

    text-align:center;

}



h2{

    font-size:2rem;

    font-weight:800;

}



.subtitle{

    color:var(--text-muted);

    margin-bottom:2rem;

}



form{

    display:flex;

    flex-direction:column;

    gap:1rem;

    text-align:left;

}



label{

    color:var(--text-muted);

}



input{

    padding:14px;

    border-radius:10px;

    border:1px solid var(--glass-border);

    background:black;

    color:white;

}



button{

    margin-top:15px;

    padding:16px;

    border:none;

    border-radius:12px;

    background:var(--primary);

    color:white;

    font-weight:700;

    cursor:pointer;

}



button:hover{

    background:var(--primary-hover);

}



.footer-text{

    margin-top:20px;

    color:var(--text-muted);

}


.footer-text a{

    color:var(--primary);

    text-decoration:none;

}


</style>


</head>


<body>


<div class="glow-orb"></div>



<div class="container">


<h2>
Secure Login 🔐
</h2>


<p class="subtitle">
Access your VisionCore Dashboard
</p>




<form id="loginForm">


<label>Email</label>

<input 
type="email"
id="loginEmail"
placeholder="Enter email"
required
>



<label>Password</label>

<input 
type="password"
id="loginPassword"
placeholder="Enter password"
required
>




<button type="submit">
Login
</button>



</form>



<p class="footer-text">

New user?

<a href="register.html">
Register
</a>

</p>


</div>






<script>


// Live Render Backend URL
const API_URL = "https://emotions-detector-backend-1.onrender.com";

// Automatically wake up backend on page load
fetch(API_URL)
    .then(res => console.log("Backend woken up successfully"))
    .catch(err => console.log("Waking up backend..."));


document
.getElementById("loginForm")
.addEventListener("submit",async(e)=>{


e.preventDefault();



const email =
document.getElementById("loginEmail").value;



const password =
document.getElementById("loginPassword").value;



try{


const response = await fetch(

`${API_URL}/login`,

{

method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

email,

password

})


}

);




const data =
await response.json();



console.log(data);



if(response.ok && data.message==="Login success"){


alert("✅ Login Success");


// save JWT token

localStorage.setItem(
"token",
data.token
);



localStorage.setItem(
"userEmail",
email
);



// dashboard redirect

window.location.href="dashboard.html";


}

else{


alert(
data.message || "Login failed"
);


}



}

catch(error){


console.log(error);


alert(
"❌ Backend server not running"
);


}



});



</script>


</body>

</html>
