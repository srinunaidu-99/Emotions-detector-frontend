<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NeuralCore AI Dashboard</title>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;
    height:100vh;

    background:#080b16;

    color:white;

    font-family:Arial, sans-serif;

    display:flex;

}



nav{

    width:80px;

    background:#05070d;

    border-right:1px solid #222;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:25px;

    padding-top:30px;

}



.nav-icon{

    width:45px;

    height:45px;

    border-radius:12px;

    background:#111827;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    font-size:22px;

}


.active{

    background:#6366f1;

}



main{

    flex:1;

    padding:30px;

    text-align:center;

}



h1{

    font-size:35px;

}


span{

    color:#00f2ff;

}




.card{


    max-width:700px;

    margin:auto;

    background:rgba(255,255,255,0.05);

    padding:20px;

    border-radius:25px;

    border:1px solid #333;


}



.video-box{

    position:relative;

    border-radius:20px;

    overflow:hidden;

    background:black;

}



video{

    width:100%;

    border-radius:20px;

    transform:scaleX(-1);

}





.corner{

    position:absolute;

    width:35px;

    height:35px;

    border:3px solid #00f2ff;

}



.tl{

top:20px;
left:20px;

border-right:none;
border-bottom:none;

}


.tr{

top:20px;
right:20px;

border-left:none;
border-bottom:none;

}



.bl{

bottom:20px;
left:20px;

border-right:none;
border-top:none;

}



.br{

bottom:20px;
right:20px;

border-left:none;
border-top:none;

}



.scan{

position:absolute;

width:100%;

height:3px;

background:#00f2ff;

top:0;

display:none;

box-shadow:0 0 20px #00f2ff;

}



@keyframes scan{

from{

top:0;

}

to{

top:100%;

}

}



.controls{

margin-top:20px;

display:flex;

gap:20px;

}



button{

flex:1;

padding:18px;

border:none;

border-radius:15px;

background:#6366f1;

color:white;

font-weight:bold;

cursor:pointer;

}



button:hover{

background:#4f46e5;

}



.status{

flex:1;

background:#05070d;

border-radius:15px;

display:flex;

align-items:center;

justify-content:center;

color:#00f2ff;

font-weight:bold;

}



</style>


</head>



<body>



<nav>

<div class="nav-icon">📊</div>

<div class="nav-icon active">📷</div>

<div class="nav-icon">👤</div>

<div class="nav-icon" onclick="location.href='index.html'">
🚪
</div>

</nav>




<main>


<h1>
NEURAL<span>CORE</span> AI
</h1>


<p>
Emotion Recognition Dashboard
</p>



<div class="card">


<div class="video-box">


<video id="video" autoplay playsinline></video>


<div class="corner tl"></div>

<div class="corner tr"></div>

<div class="corner bl"></div>

<div class="corner br"></div>


<div id="scanLine" class="scan"></div>


</div>



<div class="controls">


<button id="btn">

INITIATE NEURAL SCAN

</button>



<div class="status">

<p id="emotionText">

SYSTEM READY

</p>

</div>


</div>



</div>




</main>



<canvas id="canvas" style="display:none"></canvas>





<script>


// ======================
// BACKEND URL
// ======================


const API_URL =
"http://127.0.0.1:3000";

// ngrok use:
// const API_URL="https://your-ngrok.ngrok-free.dev";





const video =
document.getElementById("video");


const btn =
document.getElementById("btn");


const emotionText =
document.getElementById("emotionText");


const scanLine =
document.getElementById("scanLine");


const canvas =
document.getElementById("canvas");



let scanning=false;





// CAMERA


navigator.mediaDevices
.getUserMedia({

video:true

})

.then(stream=>{


video.srcObject=stream;


emotionText.innerText=
"SYSTEM READY";


})


.catch(()=>{


emotionText.innerText=
"CAMERA ERROR";


});






// DETECT



btn.onclick=async()=>{


if(scanning)
return;


scanning=true;



try{


scanLine.style.display="block";


scanLine.style.animation=
"scan 2s linear infinite";



emotionText.innerText=
"SCANNING...";



canvas.width=
video.videoWidth;


canvas.height=
video.videoHeight;



let ctx=
canvas.getContext("2d");


ctx.drawImage(
video,
0,
0
);



let image =
canvas.toDataURL(
"image/jpeg"
);




let res =
await fetch(

API_URL+"/detect-emotion",

{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:JSON.stringify({

image:image

})

}

);



let data =
await res.json();




emotionText.innerText =
data.emotion.toUpperCase();




}

catch(err){


console.log(err);


emotionText.innerText=
"SERVER ERROR";


}



finally{


scanLine.style.display="none";


btn.innerText=
"INITIATE NEURAL SCAN";


scanning=false;


}



};



</script>




</body>

</html>
